name: Monitor Carteira (08:00 BRT)

on:
  schedule:
    - cron: '0 11 * * 1-5'  # 08:00 BRT = 11:00 UTC, dias úteis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas yfinance

      - name: Run Monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/monitor.py

      - name: Commit monitor.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor.html || true
          git diff --staged --quiet || git commit -m "monitor: atualização diária $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || true
